# Local broker for the ground station.
#
# The listener has no bind address, so mosquitto listens on IPv4 and IPv6 on
# every interface. Only the car and bridge users from host/credentials.sh may
# connect. The files below resolve against the working directory: the
# generated credentials directory locally, /mosquitto/config in the container.
listener 1883
allow_anonymous false
password_file passwd
acl_file acl
# The credential files are mode 0600 and owned by the invoking user. A
# rootless container maps that user to root, which must keep reading them
# after startup. A non-root local run ignores this line.
user root
