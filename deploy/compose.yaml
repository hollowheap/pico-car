# Ground station: MQTT broker, bridge and dashboard.
#
#   podman-compose -f deploy/compose.yaml up -d --build
#
# The broker publishes 1883 on every interface so the car reaches it on the
# Wi-Fi; the bridge and the dashboard listen on the loopback only.
name: pico-car

services:
  broker:
    image: docker.io/library/eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../host/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    restart: unless-stopped

  bridge:
    build:
      context: ..
      dockerfile: deploy/bridge.Dockerfile
    environment:
      MQTT_URL: mqtt://broker:1883
    ports:
      - "127.0.0.1:${BRIDGE_LOCAL_PORT:-5280}:8080"
    volumes:
      - bridge-data:/data
    depends_on:
      - broker
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: deploy/dashboard.Dockerfile
      args:
        EXPO_PUBLIC_LINK_URL: ws://127.0.0.1:${BRIDGE_LOCAL_PORT:-5280}
        EXPO_PUBLIC_SERVICE_URL: http://127.0.0.1:${BRIDGE_LOCAL_PORT:-5280}
    ports:
      - "127.0.0.1:${DASHBOARD_LOCAL_PORT:-5281}:80"
    depends_on:
      - bridge
    restart: unless-stopped

volumes:
  bridge-data:
