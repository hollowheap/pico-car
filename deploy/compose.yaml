# Optional container deployment of Mosquitto and the ground station.
#
#   podman-compose -f deploy/compose.yaml up -d --build
#
# The broker publishes BROKER_PORT (default 1883) on every interface so the
# car reaches it on the Wi-Fi. The ground station is published on loopback.
name: pico-car

services:
  broker:
    image: docker.io/library/eclipse-mosquitto:2
    ports:
      - "${BROKER_PORT:-1883}:1883"
    volumes:
      - ../host/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    restart: unless-stopped

  bridge:
    build:
      context: ..
      dockerfile: deploy/station.Dockerfile
      args:
        EXPO_PUBLIC_ALLOW_INSECURE: "${EXPO_PUBLIC_ALLOW_INSECURE:-0}"
    environment:
      MQTT_URL: mqtt://broker:1883
    ports:
      - "127.0.0.1:${DASHBOARD_LOCAL_PORT:-5281}:8080"
    volumes:
      - bridge-data:/data
    depends_on:
      - broker
    restart: unless-stopped

volumes:
  bridge-data:
