# Single source of truth for the vehicle wire protocol (schema 3).
# Firmware, CLI, backend, and dashboard consumers are generated from or checked
# against this file; do not hand-edit generated constants or decoders.
#
# Run `npm --prefix host/dashboard run generate` after every change. It writes
#   host/dashboard/lib/schema.generated.ts   dashboard constants
#   include/telemetry/wire_schema.h          firmware offsets, sizes, codes
#   protocol/vectors.json                    known-good bytes for every packet
#   tests/telemetry_vectors.h                the same bytes for the C test
#
# Field types: int8 uint8 int16 uint16 int32 uint32, big-endian. A field with
# `count: N` is an array of N elements of that type.

schema: 3
byte_order: big

topics:
  status: "s"
  motion: "m"
  physics: "p"
  obstacle: "o"
  diag: "d"
  heartbeat: "h"
  event: "e"
  barcode_sample: "b"
  profile: "f"
  command: "c"

packets:
  # Original /s layout. The firmware sends status_pivot on the same topic.
  status:
    wire_size: 16
    fields:
      - { name: speed_mms, offset: 0, type: int16 }
      - { name: odometer_mm, offset: 2, type: uint32 }
      - { name: heading_ddeg, offset: 6, type: uint16 }
      - { name: state, offset: 8, type: uint8, enum: run_state }
      - { name: mode, offset: 9, type: uint8, enum: vehicle_mode }
      - { name: faults, offset: 10, type: uint16 }
      - { name: seq, offset: 12, type: uint16 }
      # Bits 3–4 hold barcode_element and bits 5–7 hold the latest barcode_phase.
      - { name: line_bits, offset: 14, type: uint8 }
      - { name: hold_mask, offset: 15, type: uint8 }
  # 5 Hz. Wheels and the motion controller. seq here and in physics is the
  # low byte of the status seq of the same pass: a client pairs the three
  # frames and sees a lost one. The frames of one pass share the seq and each
  # is one coherent snapshot of its subsystem; the three are not read at the
  # same instant, so cross-frame alignment is to within one pass.
  motion:
    wire_size: 17
    fields:
      - { name: left_mms, offset: 0, type: int16 }
      - { name: right_mms, offset: 2, type: int16 }
      - { name: left_target_mms, offset: 4, type: int16 }
      - { name: right_target_mms, offset: 6, type: int16 }
      - { name: left_duty_pm, offset: 8, type: int16 }
      - { name: right_duty_pm, offset: 10, type: int16 }
      - { name: motion_state, offset: 12, type: uint8, enum: motion_state }
      - { name: motion_fault, offset: 13, type: uint8, enum: motion_fault }
      - { name: overruns, offset: 14, type: uint16 }
      - { name: seq, offset: 16, type: uint8 }
  # 5 Hz. IMU, hump and attitude. Roll, az, amag and attitude_state can hold
  # their last known values while calibration is missing or IMU faults are set.
  physics:
    wire_size: 24
    fields:
      - { name: pitch_cdeg, offset: 0, type: int16 }
      - { name: roll_cdeg, offset: 2, type: int16 }
      - { name: az_mg, offset: 4, type: int16 }
      - { name: amag_mg, offset: 6, type: uint16 }
      - { name: a_fwd_mg, offset: 8, type: int16 }
      - { name: yaw_rate_cdps, offset: 10, type: int16 }
      - { name: heading_ddeg, offset: 12, type: uint16 }
      - { name: hump_peak_mm, offset: 14, type: uint16 }
      - { name: run_peak_mm, offset: 16, type: uint16 }
      - { name: hump_state, offset: 18, type: uint8, enum: hump_state }
      - { name: motion_class, offset: 19, type: uint8, enum: motion_class }
      - { name: physics_faults, offset: 20, type: uint8, enum: physics_faults }
      - { name: flags, offset: 21, type: uint8, enum: physics_flags }
      - { name: attitude_state, offset: 22, type: uint8, enum: attitude_state }
      - { name: seq, offset: 23, type: uint8 }
  # 2 Hz and on change. Sonar and hug. width_mm, breadth_mm and face_mm are 0
  # until seen.
  obstacle:
    wire_size: 24
    fields:
      - { name: state, offset: 0, type: uint8, enum: obstacle_state }
      - { name: cause, offset: 1, type: uint8, enum: obstacle_cause }
      - { name: faults, offset: 2, type: uint16, enum: obstacle_faults }
      - { name: echo_class, offset: 4, type: uint8, enum: echo_class }
      - { name: flags, offset: 5, type: uint8, enum: obstacle_flags }
      - { name: dist_mm, offset: 6, type: uint16 }
      - { name: closest_mm, offset: 8, type: uint16 }
      - { name: seq, offset: 10, type: uint8 }
      - { name: hug_state, offset: 11, type: uint8, enum: hug_state }
      - { name: hug_side, offset: 12, type: uint8, enum: hug_side }
      # Counts hug publishes, low two bits (0..3, wraps): a client sees a new
      # hug sample by a changed value. 0 until the first publish.
      - { name: hug_seq, offset: 13, type: uint8 }
      - { name: width_mm, offset: 14, type: uint16 }
      - { name: breadth_mm, offset: 16, type: uint16 }
      - { name: face_mm, offset: 18, type: uint16 }
      - { name: servo_deci, offset: 20, type: int16 }
      - { name: body_deci, offset: 22, type: int16 }
  # 1 Hz. Counters and health.
  diag:
    wire_size: 45
    fields:
      - { name: sticky_faults, offset: 0, type: uint16 }
      - { name: task_alive_mask, offset: 2, type: uint16 }
      - { name: line_lost_count, offset: 4, type: uint16 }
      - { name: line_search_mm, offset: 6, type: uint16 }
      - { name: barcode_ok, offset: 8, type: uint16 }
      - { name: barcode_bad, offset: 10, type: uint16 }
      - { name: barcode_edge_drops, offset: 12, type: uint16 }
      - { name: last_barcode, offset: 14, type: uint8 }
      - { name: last_barcode_action, offset: 15, type: uint8, enum: barcode_action }
      - { name: telem_queue_drops, offset: 16, type: uint16 }
      - { name: net_queue_drops, offset: 18, type: uint16 }
      - { name: physics_overruns, offset: 20, type: uint16 }
      - { name: telemetry_overruns, offset: 22, type: uint16 }
      - { name: echo_valid, offset: 24, type: uint8 }
      - { name: echo_open, offset: 25, type: uint8 }
      - { name: echo_too_close, offset: 26, type: uint8 }
      - { name: echo_no_echo, offset: 27, type: uint8 }
      - { name: echo_glitch, offset: 28, type: uint8 }
      - { name: echo_stuck, offset: 29, type: uint8 }
      - { name: line_edges_per_s, offset: 30, type: uint8 }
      - { name: line_raw_edges_per_s, offset: 31, type: uint8 }
      - { name: supervisor_passes, offset: 32, type: uint16 }
      # The smallest free stack since boot, and the task it belongs to
      # (index in main.c stack order). Cached from the 30 s stack scan.
      - { name: stack_min_free, offset: 34, type: uint16 }
      - { name: stack_min_task, offset: 36, type: uint8 }
      # Commands the supervisor inbox dropped when full: the low byte of a
      # count that wraps. A client takes the difference between frames.
      - { name: cmd_ring_drops, offset: 37, type: uint8 }
      # The last command id the car accepted, 0 before the first. A sender
      # that starts or restarts sends the next id after it.
      - { name: cmd_last_id, offset: 38, type: uint16 }
      # Commands the car refused, one count per cause, each the low byte of a
      # count that wraps like cmd_ring_drops: a wrong length; an unknown
      # opcode; another run id; an id not newer than cmd_last_id; an uptime
      # echo more than 3 s old or ahead of the car.
      - { name: cmd_rej_length, offset: 40, type: uint8 }
      - { name: cmd_rej_opcode, offset: 41, type: uint8 }
      - { name: cmd_rej_run, offset: 42, type: uint8 }
      - { name: cmd_rej_old_id, offset: 43, type: uint8 }
      - { name: cmd_rej_age, offset: 44, type: uint8 }
  # 1 Hz. Sent by the connection task, not through the queue. run_id is
  # random and non-zero at each boot; a command must carry it. drops counts
  # the frames lost since boot: both queues plus the frames the TCP send ring
  # had no room for, summed and held at 255.
  heartbeat:
    wire_size: 10
    fields:
      - { name: uptime_s, offset: 0, type: uint32 }
      - { name: drops, offset: 4, type: uint8 }
      - { name: wifi_rssi, offset: 5, type: int8 }
      - { name: reset_reason, offset: 6, type: uint8, enum: reset_reason }
      - { name: link_state, offset: 7, type: uint8, enum: link_state }
      - { name: run_id, offset: 8, type: uint16 }
  # On event. QoS 1 in the queue; a status frame never evicts it.
  event:
    wire_size: 12
    fields:
      - { name: event_id, offset: 0, type: uint16 }
      - { name: event_type, offset: 2, type: uint8, enum: event_type }
      - { name: source, offset: 3, type: uint8, enum: event_source }
      - { name: p1, offset: 4, type: int16 }
      - { name: p2, offset: 6, type: uint16 }
      - { name: odometer_mm, offset: 8, type: uint32 }
  # Once per finished scan. The 37 packed slots (12-bit distance, 3-bit class,
  # measured flag) of the original scan frame, slot 18 straight ahead.
  profile:
    wire_size: 82
    fields:
      - { name: req_id, offset: 0, type: uint8 }
      - { name: status, offset: 1, type: uint8, enum: profile_status }
      - { name: side, offset: 2, type: uint8 }
      - { name: flags, offset: 3, type: uint8, enum: profile_flags }
      - { name: closest_mm, offset: 4, type: uint16 }
      - { name: width_mm, offset: 6, type: uint16 }
      - { name: slots, offset: 8, type: uint16, count: 37 }
  # Current /d layout. Keep the 45-byte layout for previously recorded runs.
  diag_counts:
    variant_of: diag
    wire_size: 73
    fields:
      - { name: sticky_faults, offset: 0, type: uint16 }
      - { name: task_alive_mask, offset: 2, type: uint16 }
      - { name: line_lost_count, offset: 4, type: uint16 }
      - { name: reserved, offset: 6, type: uint16 }
      - { name: barcode_ok, offset: 8, type: uint16 }
      - { name: barcode_bad, offset: 10, type: uint16 }
      - { name: barcode_edge_drops, offset: 12, type: uint16 }
      - { name: last_barcode, offset: 14, type: uint8 }
      - { name: last_barcode_action, offset: 15, type: uint8, enum: barcode_action }
      - { name: telem_queue_drops, offset: 16, type: uint16 }
      - { name: net_queue_drops, offset: 18, type: uint16 }
      - { name: physics_overruns, offset: 20, type: uint16 }
      - { name: telemetry_overruns, offset: 22, type: uint16 }
      - { name: line_edges_total, offset: 24, type: uint32 }
      - { name: line_raw_edges_total, offset: 28, type: uint32 }
      - { name: supervisor_passes, offset: 32, type: uint16 }
      # The smallest free stack since boot, and the task it belongs to
      # (index in main.c stack order). Cached from the 30 s stack scan.
      - { name: stack_min_free, offset: 34, type: uint16 }
      - { name: stack_min_task, offset: 36, type: uint8 }
      # Commands the supervisor inbox dropped when full: the low byte of a
      # count that wraps. A client takes the difference between frames.
      - { name: cmd_ring_drops, offset: 37, type: uint8 }
      # The last command id the car accepted, 0 before the first. A sender
      # that starts or restarts sends the next id after it.
      - { name: cmd_last_id, offset: 38, type: uint16 }
      # Commands the car refused, one count per cause, each the low byte of a
      # count that wraps like cmd_ring_drops: a wrong length; an unknown
      # opcode; another run id; an id not newer than cmd_last_id; an uptime
      # echo more than 3 s old or ahead of the car.
      - { name: cmd_rej_length, offset: 40, type: uint8 }
      - { name: cmd_rej_opcode, offset: 41, type: uint8 }
      - { name: cmd_rej_run, offset: 42, type: uint8 }
      - { name: cmd_rej_old_id, offset: 43, type: uint8 }
      - { name: cmd_rej_age, offset: 44, type: uint8 }
      # Cumulative counter order matches echo_class codes 0 through 5.
      - { name: echo_total, offset: 45, type: uint32, count: 6 }
      # Low 32 bits of the boot-relative hardware timer, in microseconds.
      - { name: sensor_sample_us, offset: 69, type: uint32 }

  # Best effort, one packet per captured GP26 transition. edge_us wraps at
  # 32 bits. level_high is the level after the edge. An interval ends at
  # this edge; zero starts a span. capture_loss breaks continuity. seq
  # increments even when delivery fails. UINT32_MAX is an unknown odometer.
  # width_um is usable only with width_valid and saturates at 65535.
  barcode_sample:
    wire_size: 18
    fields:
      - { name: edge_us, offset: 0, type: uint32 }
      - { name: interval_us, offset: 4, type: uint32 }
      - { name: odometer_mm, offset: 8, type: uint32 }
      - { name: width_um, offset: 12, type: uint16 }
      - { name: seq, offset: 14, type: uint8 }
      - { name: level_high, offset: 15, type: uint8 }
      - { name: width_valid, offset: 16, type: uint8 }
      - { name: capture_loss, offset: 17, type: uint8 }

  # Current /s layout. Pivot scale is the measured body yaw as a percentage
  # of encoder yaw in a steady pivot. Zero means no usable measurement.
  status_pivot:
    variant_of: status
    wire_size: 17
    fields:
      - { name: speed_mms, offset: 0, type: int16 }
      - { name: odometer_mm, offset: 2, type: uint32 }
      - { name: heading_ddeg, offset: 6, type: uint16 }
      - { name: state, offset: 8, type: uint8, enum: run_state }
      - { name: mode, offset: 9, type: uint8, enum: vehicle_mode }
      - { name: faults, offset: 10, type: uint16 }
      - { name: seq, offset: 12, type: uint16 }
      - { name: line_bits, offset: 14, type: uint8 }
      - { name: hold_mask, offset: 15, type: uint8 }
      - { name: pivot_scale_pct, offset: 16, type: uint8 }

# A command on the command topic is a 9-byte frame, big-endian:
#   cmd_id u16, run_id u16, opcode u8, uptime_s u32
# run_id and uptime_s are copied from the newest heartbeat. The car accepts a
# command only when all of these hold:
#   - run_id is the run id of this boot.
#   - cmd_id is newer than the last id it accepted (diag cmd_last_id): at most
#     32767 ahead in the 16-bit sequence, so it wraps after 0xFFFF. The first
#     command after a boot may carry any id.
#   - Its own uptime minus the echoed uptime_s is 0 to 3 s. Both count whole
#     seconds, so a command within 3 s of the heartbeat it echoes is always
#     accepted and one 4 s or more after it is always refused.
# Each refusal is counted in the diag cmd_rej_* fields.
commands:
  stop: 0x00
  start: 0x01
  reset: 0x02
  left: 0x03
  right: 0x04
  uturn: 0x05
  estop: 0x06
  straight: 0x07
  recalibrate: 0x08
  start_continuous_floor: 0x09
  start_stationary: 0x0A

# Event types. The `p1` and `p2` layouts:
#   barcode      p1 = ASCII letter (S straight, L left, R right, U u-turn, H halt),
#                p2 = narrow width/4 um << 4 | reverse << 3 | action
#   barcode_bad  p1 = reason (1 element, 2 parity, 3 delimiter, 4 speed, 5 duplicate, 6 non-letter symbol, 7 capture loss)
#                p2 = estimated width of the last element in µm, 0 if unavailable
#   barcode_block  p1 = length of a black block in mm (over 50, saturates at 32767); at most
#                one event per 200 mm of travel
#   barcode_phase  p1 = barcode_phase (1 start, 2 decoding, 3 complete, 4 aborted);
#                p2 bit 0 = reverse and bits 8–15 = barcode_bad reason if present.
#                Emitted after the opening delimiter, first accepted data element,
#                and completion or abort of that active read.
#                Idle aborts use the odometer at the last observed edge.
#   cmd_accept   p1 = source << 8 | opcode (source 1 telemetry, 2 barcode, 3 button),
#                p2 = cmd_id of a telemetry command, including 0 after wrap.
#                For barcode and button commands p2 is 0 and carries no ID.
#   cmd_reject   p1 = reason << 12 | source << 8 | opcode, p2 = cmd_id as in
#                cmd_accept; reason 1 not running, 2 busy, 3 latched, 4 lifted,
#                5 source, 6 opcode, 7 on a hump, 8 stalled, 9 lean unknown,
#                10 hardware connection fault.
#                Source 0 identifies a line-task turn refusal.
#   task_stall   p1 = liveness bit; 0x80 = the car does not move; 0x81 = line sensors stuck;
#                0x82 = the wheels answer crosswise (encoder plugs swapped)
#   line_lost    p1 = side that saw the line last (0 none, 1 left, 2 right), p2 = 0 when the
#                search starts; sent again with p2 = 0x8000 | the retry number (1 up) when a
#                failed search turns back, reverses and searches again; sent once more with
#                p2 = the search turn in degrees (each way) when the car stops
#   line_found   p1 = side that saw the line last, p2 = distance driven while lost, in mm
#   pilot_decision  p1 = speed mm/s, p2 = behaviour << 8 | reason
#                behaviour 0 none, 1 safety, 2 hug, 3 follow line; reason 0 none,
#                1 stale wheel feedback, 2 estop, 3 line lost, 4 stuck,
#                5 encoder, 6 sonar, 7 held, 8 hug move timeout,
#                9 sonar latched, 10 stale wheel feedback latched,
#                11 course clearance unverified (requires START),
#                12 checking course clearance (automatic recovery),
#                13 searching for the line after a detour, 14 no line after a detour,
#                15 crawling without sonar
#   boot         p1 = reset reason, p2 = failed self-test checks (1 imu, 2 sonar, 4 beam,
#                8 imu not calibrated)
#   recovery     the pilot began an automatic recovery: p1 = the pilot reason it
#                recovers from (5 encoder, 8 hug move timeout, 9 sonar latched for a
#                crawl without sonar, 11 course clearance), p2 = attempts allowed << 8 |
#                this attempt (1 up). Clean travel, START or RESET restart the count.
#                From the supervisor: a watchdog reboot resumed the run, p1 = reset reason
#                (1 watchdog), p2 = resumes allowed << 8 | this resume.
#   build        once after boot: p1 = build_flag bits << 12 | hash bits 27..16,
#                p2 = hash bits 15..0 of the 28-bit git short hash (0 when unknown)
#   stop_timing  an accepted STOP or ESTOP: p1 = acceptance to motor duty 0 in ms,
#                p2 = acceptance to both wheels at rest in ms (65535 when they never
#                rest); odometer at rest
#   rejoin       the bypass rejoined the line and the follower holds it: p1 = body
#                heading minus the entry heading in deci-degrees, p2 = lateral offset
#                from the entry line in mm as a signed 16-bit value
#   junction     p1 = junction_kind. stripe: the follower measured a transverse tape
#                stripe, p2 = junction_stripe bits. probe: a barcode route probe ended
#                without a turn, p2 = turn (as turn_*) << 8 | junction_probe outcome
#   turn_*       p1 = turn (1 left, 2 right, 3 u-turn, 4 straight), p2 = elapsed ms on done/abort
#   run_stop     p1 = run state entered (2 stopped, 3 held, 4 latched),
#                p2 = run_stop_reason
#   motion_state p1 = previous state << 8 | new state, p2 = motion fault << 8 | applied hold mask
#   obstacle_seen  p1 = distance mm
#   scan_done    p1 = plan status (0 ok, 1 clear, 2 no safe path, 3 failed,
#                4 stationary pilot scan, course clearance unverified), p2 = width mm
#   bypass_start p1 = side (0 left, 1 right)
#   bypass_end   p1 = front width mm, p2 = breadth mm (0 when not seen)
#   obstacle_stop  p1 = obstacle cause, p2 = echo class
#   sonar_aim    p1 = commanded servo angle in signed deci-degrees, positive left;
#                no shaft feedback, p2 = 0
#   hump_end     p1 = peak mm, p2 = 1 when the height is valid
#   lift_start, lift_end, overturn: p1 = angle to calibrated rest gravity in
#                centidegrees (0x7FFF when the zero vector has no direction),
#                p2 = acceleration magnitude in mg (legacy frames are both zero)
#   fault_set, fault_clear  p1 = fault bit
events:
  boot: 0x01
  run_start: 0x02
  run_stop: 0x03
  cmd_accept: 0x04
  cmd_reject: 0x05
  motion_state: 0x06
  build: 0x07
  stop_timing: 0x08
  barcode: 0x10
  barcode_bad: 0x11
  turn_start: 0x12
  turn_done: 0x13
  turn_abort: 0x14
  barcode_block: 0x15
  barcode_phase: 0x16
  junction: 0x17
  line_lost: 0x18
  line_found: 0x19
  pilot_decision: 0x1A
  recovery: 0x1B
  obstacle_seen: 0x20
  scan_done: 0x21
  bypass_start: 0x22
  bypass_end: 0x23
  obstacle_stop: 0x24
  sonar_aim: 0x25
  rejoin: 0x26
  hump_start: 0x30
  hump_end: 0x31
  lift_start: 0x38
  lift_end: 0x39
  overturn: 0x3A
  fault_set: 0x40
  fault_clear: 0x41
  task_stall: 0x48
  link_up: 0x50
  link_down: 0x51

# Named codes for the fields that carry enumerations. Values match the
# firmware constants in src/navigation/obstacle/obstacle_pack.h,
# src/physics/hump_msg.h and imu_motion.h, and src/motion/controller.h.
enums:
  run_state:
    values:
      init: 0
      ready: 1
      running: 2
      stopped: 3
  run_stop_reason:
    values:
      unspecified: 0
      startup_unverified: 1
  vehicle_mode:
    values:
      stopped: 0
      follow: 1
      turn: 2
      search: 3
      hold: 4
      bypass: 5
      hold_barcode: 6
      lifted: 7
      overturned: 8
  motion_state:
    values:
      idle: 0
      running: 1
      reversing: 2
      stopped: 3
      fault: 4
  motion_fault:
    values:
      none: 0
      command: 1
      expired: 2
      feedback: 3
      gap: 4
      no_edges: 5
      output: 6
  obstacle_state:
    values:
      stopped: 0
      monitor: 1
      wait_stop: 2
      scanning: 3
      plan: 4
      bypass: 5
      reacquire: 6
  profile_status:
    values:
      ok: 0
      clear: 1
      no_safe_path: 2
      failed: 3
      pilot_sparse: 4  # stationary observations at one pose, unmeasured slots clear
  obstacle_cause:
    values:
      none: 0
      boot: 1
      external: 2
      no_echo: 3
      echo_stuck: 4
      scan_timeout: 5
      no_safe_path: 6
      collision: 7
      handover: 8
      plan_timeout: 9
      plan_rejected: 10
      bypass_limit: 11
      line_timeout: 12
      init_fail: 13
      echo_noise: 14
      bypass_gave_up: 15
  hug_state:
    values:
      idle: 0
      contact: 1
      backoff: 2
      align: 3
      leg: 4
      look: 5
      turn: 6
      inner: 7
      exit: 8
  hug_side:
    values:
      left: 0
      right: 1
      none: 2
  echo_class:
    values:
      valid: 0
      open: 1
      too_close: 2
      no_echo: 3
      glitch: 4
      stuck: 5
  obstacle_faults:
    bits:
      no_echo: 0
      echo_stuck: 1
      scan_timeout: 2
      no_safe_path: 3
      collision: 4
      handover: 5
      bypass_limit: 6
      line_timeout: 7
      echo_noise: 8
  profile_flags:
    bits:
      wall: 0
      probe_side_valid: 1  # pilot_sparse: side identifies the selected edge to investigate
      stationary_contact: 2  # front or side fan measured at one stopped axle pose
      endpoint_lsb: 4  # bits 4..7: 0 unconfirmed, 1..9 measured side endpoint at -20..+20 degrees in 5-degree steps
  obstacle_flags:
    bits:
      wall: 0
      servo_moving: 1
      body_pivoting: 2
      echo_noisy: 3
      echo_inconsistent: 4
      beam_blocked: 5
      scan_noisy: 6
  hump_state:
    values:
      flat: 0
      climb: 1
      crest: 2
      descend: 3
  motion_class:
    values:
      unknown: 0
      stationary: 1
      moving: 2
      accelerating: 3
      turning: 4
      climbing: 5
      descending: 6
      lifted: 7
  attitude_state:
    values:
      ok: 0
      candidate: 1
