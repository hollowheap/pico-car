name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure CMake
        run: nix develop -c ./configure.sh

      - name: Build firmware
        run: nix develop -c ./build.sh

      # BARR-C:2018 clang-tidy gate (D84, D90). Fails on any finding in
      # src/ or include/; the log is kept under build/lint/.
      - name: Lint firmware (BARR-C)
        run: bash tools/lint.sh
